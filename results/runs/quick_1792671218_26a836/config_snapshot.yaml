adaptive_policy:
  anchor_sensor: wrist
  cost_budget: 1.0
  min_dwell_windows: 4
  probe_interval: 20
  r_good: 0.7
  r_low: 0.4
  u_high: 0.65
  u_low: 0.35
dataset:
  activities:
    1: Lying
    2: Sitting
    3: Standing
    4: Walking
    5: Running
    6: Cycling
  all_subjects:
  - 101
  - 102
  - 103
  - 104
  - 105
  - 106
  - 107
  - 108
  - 109
  citation: "A. Reiss and D. Stricker, \"Introducing a new benchmarked dataset for\
    \ activity monitoring,\" in Proceedings of the 16th International Symposium on\
    \ Wearable Computers, 2012, pp. 108\u2013109."
  doi: 10.24432/C5NW2H
  download_url: https://archive.ics.uci.edu/static/public/231/pamap2%2Bphysical%2Bactivity%2Bmonitoring.zip
  label_purity_threshold: 0.8
  quick_subjects:
  - 101
  - 102
  - 105
  raw_dir: data/raw
  sampling_rate: 100
  sensors:
    ankle:
      accel_cols:
      - 38
      - 39
      - 40
      cost_weight: 1.0
      gyro_cols:
      - 44
      - 45
      - 46
    chest:
      accel_cols:
      - 21
      - 22
      - 23
      cost_weight: 1.0
      gyro_cols:
      - 27
      - 28
      - 29
    wrist:
      accel_cols:
      - 4
      - 5
      - 6
      cost_weight: 1.0
      gyro_cols:
      - 10
      - 11
      - 12
  window_size: 256
  window_stride: 128
experiment:
  name: reliability_gated_har
  random_seed: 42
  version: 1.0.0
fault_injection:
  random_state: 42
  scenarios:
  - dropout
  - intermittent
  - noise
  - flatline
  - drift
  severities:
    mild: 0.25
    moderate: 0.5
    severe: 0.85
models:
  cnn_lstm:
    batch_size: 64
    conv1_filters: 32
    conv1_kernel: 7
    conv2_filters: 64
    conv2_kernel: 5
    dropout: 0.3
    epochs: 15
    input_channels: 6
    learning_rate: 0.001
    lstm_hidden: 64
    patience: 3
    random_state: 42
    sequence_length: 256
  random_forest:
    class_weight: balanced
    max_depth: 15
    min_samples_leaf: 2
    n_estimators: 100
    n_jobs: -1
    random_state: 42
paths:
  report_assets_dir: report_assets
  results_dir: results/runs
reliability:
  thresholds:
    clipping_accel: 155.0
    flatline_var: 0.0001
    noise_diff_var: 50.0
  weights:
    clipping: 0.15
    flatline: 0.3
    missing_ratio: 0.35
    noise: 0.2
